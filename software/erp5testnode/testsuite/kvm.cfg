[buildout]
extends = 
   ../../kvm/software.cfg
   testsuite.cfg

parts += template-erp5testnode

[default-test-image]
# Debian 13 image built with Packer (slapos.package's
# packer/scripts/vm-bootstrap.sh), published on shacache and listed at
# http://shadir.nxdcdn.com/packer-images. It is qcow2 v3, which qmpbackup
# needs for incremental backup (persistent bitmaps require qcow2 v3,
# unlike the image published for this test before, which was qcow2 v2).
recipe = slapos.recipe.build:download
url = https://shacache.nxdcdn.com/b25e214d92814f306f851f404e079aca19205c641afc584b38f9e209d6042e7fb401211db0af1eaf8a5b471ac2578b1497ed637ad03a75f75eaab91b829fdfb5
md5sum = 339bcf1fc211d5a576adaae52195087b

[default-test-bootstrap-script]
# Installs the get/set key-value server this test talks to on port 10080;
# see software/kvm/tests/resiliency-image/vm-bootstrap.sh.
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/../../kvm/tests/resiliency-image/vm-bootstrap.sh
md5sum = 92937e8c7847fbf21bab12eddd5ce26d

[template-resilient-test]
# Ingest extra-context, on a the final template-resilient-test rendering
# always ingest raw values.
extra-context =
  raw default_test_image_url file://${default-test-image:target}
      raw default_test_image_md5sum ${default-test-image:md5sum}
      raw default_bootstrap_script_url file://${default-test-bootstrap-script:target}
      raw default_bootstrap_script_md5sum ${default-test-bootstrap-script:md5sum}
