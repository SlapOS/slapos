[buildout]
extends =
  ../erp5/software-py3.cfg

[default-bt5]
list =
  erp5_full_text_mroonga_catalog
  networkcache_erp5

[erp5-defaults]
# Uploads to shacache can be bigger than the zope default (1GB).
form-disk-limit-default = 5GB

[erp5]
# This branch sends big files from the ZODB a bit at a time under WSGI,
# and gives the form-disk-limit of zope.conf to waitress.
branch = wsgi_medusa_stream_fix
