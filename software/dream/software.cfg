[buildout]
extends =
  ../../stack/slapos.cfg
  ../../stack/nodejs.cfg
  ../../component/manpy/buildout.cfg
  ../../component/scipy/buildout.cfg
  ../../stack/monitor/buildout.cfg
  ./buildout.hash.cfg

parts =
  slapos-cookbook
  manpy
  dream-testrunner
  npm-install
  instance

[dream-repository.git]
branch = py3
# during dev use branch not revision
# revision = f864489fa13c61e0b986ee4c6f31d5324573dac4
revision =


[instance]
recipe = slapos.recipe.template
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/instance.cfg

[dream-testrunner]
recipe = zc.recipe.testrunner
eggs = dream
script = dream_testrunner
initialization =
  ${manpy:initialization}

[npm-install]
recipe = plone.recipe.command
stop-on-error = true
command =
  cd ${dream-repository.git:location}
  PATH=${git:location}/bin:${nodejs:location}/bin:$PATH
  npm install .

[versions]
rpy2 = 3.6.9
rpy2-rinterface = 3.6.7
rpy2-robjects = 3.6.6
pydot = 4.0.1:whl
xlrd = 1.2.0
xlwt = 1.3.0
simpy = 4.1.2:whl
zope.dottedname = 6.1
tablib = 3.10.0:whl
mysqlclient = 2.0.1
zc.recipe.testrunner = 3.2.0
