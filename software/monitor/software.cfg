[buildout]

extends =
  buildout.hash.cfg
  ../../component/python-cryptography/buildout.cfg
  ../../component/python3/buildout.cfg
  ../../component/pandas/buildout.cfg
  ../../component/scipy/buildout.cfg
  ../../component/statsmodels/buildout.cfg
  ../../component/defaults.cfg
  ../../stack/monitor/buildout.cfg
  ../../stack/slapos.cfg


parts =
  slapos-cookbook
  network-bench-cfg
  json-test-template
  template
  software.cfg.json
  instance-default-input-schema.json
  instance-edgetest-basic-input-schema.json

[template]
recipe = slapos.recipe.template
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/template.cfg

[copy-to-instance]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:_buildout_section_name_}
filename = ${:_buildout_section_name_}

[copy-at-root]
<= copy-to-instance
destination = ${buildout:directory}/${:_buildout_section_name_}

[software.cfg.json]
<= copy-at-root

[instance-default-input-schema.json]
<= copy-at-root

[instance-edgetest-basic-input-schema.json]
<= copy-at-root

[template-monitor-edgetest-basic]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:_update_hash_filename_}

[template-surykatka-ini]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:_update_hash_filename_}

[template-node-monitoring]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:_update_hash_filename_}

[json-test-template]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:_update_hash_filename_}

[network-bench-cfg]
recipe = slapos.recipe.template
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:parts-directory}/${:_buildout_section_name_}

[monitor-collect-csv-dump]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:filename}

[surykatka]
recipe = zc.recipe.egg
script-name = ${:_buildout_section_name_}

[monitor-eggs]
recipe = zc.recipe.egg
eggs +=
  slapos.cookbook
  slapos.recipe.cmmi
  plone.recipe.command
scripts =

[versions]

surykatka = 0.9.0

# For surykatka 0.7.1

dnspython = 2.1.0:whl
miniupnpc = 2.0.2
peewee = 3.14.4
python-whois = 0.7.3
# no future pin here: inherit future 1.0.0 from stack/slapos.cfg. The old
# 0.18.3 override (a surykatka 0.7.1-era leftover) imports the `imp` module
# via python-whois, which Python 3.12 removed, so surykatka failed to start.

# use old netaddr because we are using old setuptools
netaddr = 0.7.19

[slapos-toolbox-dependencies]
eggs +=
  ${pandas:egg}
  ${statsmodels:egg}
  ${scipy:egg}
