[buildout]
extends =
  ../../stack/slapos.cfg
  ../../component/babeld/buildout.cfg
  ../../component/geoip2/buildout.cfg
  ../../component/openvpn/buildout.cfg
parts =
  osc
  openvpn
  re6stnet

[rpm]
recipe = zc.recipe.egg:custom
egg = ${:_buildout_section_name_}
setup-eggs = setuptools-scm

[osc]
recipe = zc.recipe.egg
eggs =
  ${python-cryptography:egg}
  ${rpm:egg}
  osc
scripts = osc

[obs-common]
recipe = slapos.recipe.build
base = ${:_profile_base_location_}
environment =
  PATH=${git:location}/bin:%(PATH)s
setup-eggs =
  setuptools_scm
  python-debian
update =
  import os
  from subprocess import check_output
  def git(*args):
    return check_output(("git", *args), cwd=options["base"], text=True).rstrip()
  mtime, options['Maintainer'] = git(
    "log", "-1", "--format=%at %aN <%aE>", ".").split(None, 1)
  options['mtime'] = int(mtime)
  url = git("remote", "get-url", "origin")
  if url.endswith(".git"):
    url = url[:-4]
  prefix = git("rev-parse", "--show-prefix").rstrip(os.sep)
  options["Vcs-Git"] = f"{url} [{prefix}]"

# In below sections, pkg-version can be increased temporarily when making a new
# release of the same source code (i.e. only changes in the packaging).

[babeld-repository]
revision = v1.13.1-nxd1

[babeld]
recipe = slapos.recipe.build
shared = false
environment = ${obs-common:environment}
tag = ${babeld-repository:revision}
debian-version = 1.13.1+ds-1
debian-md5sum = de29ea99384827e750337af8497664cf
pkg-version = 2
epoch = 1
install =
  import os, re, subprocess, tarfile
  from io import BytesIO
  from debian.changelog import format_date, Changelog
  from debian.deb822 import Deb822

  common = self.buildout["obs-common"]
  repos = options["path"]
  def git_output(*args, **kw):
    return subprocess.check_output(("git", *args), cwd=repos, **kw)
  mtime = int(git_output("log", "-1", "--format=%ct", text=True))
  repos_url = git_output("remote", "get-url", "origin", text=True).rstrip()
  if repos_url.endswith(".git"):
    repos_url = repos_url[:-4]

  files = git_output("ls-files", "-z", "--recurse-submodules")
  files = files.rstrip(b'\0').split(b'\0')
  files.sort()
  version = options["tag"][1:].replace("-nxd", "+nxd")
  prefix = "babeld-" + version
  def tarfilter(tarinfo):
    tarinfo.uid = tarinfo.gid = 0
    tarinfo.uname = tarinfo.gname = "root"
    tarinfo.mtime = mtime
    return tarinfo
  os.makedirs(location)
  with tarfile.open(f"{location}/babeld_{version}.tar.xz", "w:xz") as wtar:
    for x in files:
      x = x.decode()
      if not x.startswith("BLAKE2/"):
        wtar.add(os.path.join(repos, x), os.path.join(prefix, x),
                 filter=tarfilter)

  debian_base = self.download(
    "https://deb.debian.org/debian/pool/main/b/babeld/"
    "babeld_%(debian-version)s.debian.tar.xz" % options,
    options["debian-md5sum"])

  dsc = Deb822()
  dsc["Version"] =  "%s:%s-%s" % (
    options["epoch"], version, options["pkg-version"])
  with tarfile.open(debian_base, mode='r:xz') as rtar, \
       tarfile.open(os.path.join(location, "debian.tar.xz"), "w:xz") as wtar:
    for tarinfo in rtar:
      fileobj = rtar.extractfile(tarinfo)
      while True: # not a loop
        if tarinfo.name == "debian/changelog":
          dch = Changelog(fileobj)
          dch.new_block(
            package=dch.package,
            version=dsc["Version"],
            distributions="nexedi",
            author=common["Maintainer"],
            date=format_date(common["mtime"]),
            changes=["""
    * Nexedi fork for re6stnet.
    * babeld.service is disabled by default.
  """])
          x = str(dch).encode()
        elif tarinfo.name == "debian/control":
          s = Deb822(fileobj); b = Deb822(fileobj)
          s["Build-Depends"] = "debhelper-compat (= 12), libb2-dev"
          s["Homepage"] = repos_url
          del s["Uploaders"], s["Vcs-Browser"]
          for x in "Maintainer", "Vcs-Git":
            s[x] = common[x]
          x = f"{s}\n{b}".encode()
        elif tarinfo.name == "debian/rules":
          x = fileobj.read() + b"""
  override_dh_installsystemd:
  \tdh_installsystemd --no-enable
  """
        elif tarinfo.name == "debian/patches/0001-Allow-using-sha2-and-blake2-system-libaries.patch":
          # Fix conflicts with Nexedi changes in Makefile.
          x = re.sub(rb'(\n[-+]       )(hmac)(\.[co])',
                     rb'\1ctl\3 \2\3', fileobj.read())
        else:
          if tarinfo.name == "debian/source/format":
            fileobj = BytesIO(fileobj.read())
            dsc["Format"] = fileobj.getvalue().decode().strip()
          break
        tarinfo.mtime = common["mtime"]
        tarinfo.size = len(x)
        fileobj = BytesIO(x)
        break
      wtar.addfile(tarinfo, fileobj=fileobj)

  for x in "Source", "Build-Depends":
    dsc[x] = s[x]
  dsc["Architecture"] = b["Architecture"]
  with open(os.path.join(location, "babeld.dsc"), 'w') as x:
    x.write(str(dsc))

[openvpn]
recipe = slapos.recipe.build
shared = false
environment = ${obs-common:environment}
pkg-version = 1
install =
  import os, subprocess, tarfile
  from io import BytesIO
  from debian.changelog import format_date, Changelog
  from debian.deb822 import Deb822

  common = self.buildout["obs-common"]

  os.makedirs(location)
  url = options["url"]
  self.download(path=os.path.join(location, url[url.rindex('/')+1:]))

  dsc = Deb822()
  dsc["Version"] = "%(version)s-%(pkg-version)s" % options

  src_prefix = os.path.join(common["base"], "openvpn-")
  def taraddtext(tarinfo, text):
    x = text.encode()
    tarinfo.size = len(x)
    wtar.addfile(tarinfo, BytesIO(x))
  def tarfilter(tarinfo):
    tarinfo.uid = tarinfo.gid = 0
    tarinfo.uname = tarinfo.gname = "root"
    tarinfo.mtime = common["mtime"]
    name = tarinfo.name
    if name == "debian/control":
      with open(src_prefix + name, 'rb') as x:
        s = Deb822(x); b = Deb822(x)
      for x in "Maintainer", "Vcs-Git":
        s[x] = common[x]
      taraddtext(tarinfo, f"{s}\n{b}")
      for x in "Source", "Build-Depends":
        dsc[x] = s[x]
      dsc["Architecture"] = b["Architecture"]
      x = Changelog()
      x.new_block(
        package=s["Source"],
        version=dsc["Version"],
        distributions="nexedi",
        author=s["Maintainer"],
        date=format_date(tarinfo.mtime),
        changes=[""],
      )
      tarinfo.name = "debian/changelog"
      x = str(x)
    elif name == "debian/rules.in":
      with open(src_prefix + name) as x:
        x = x.read() % ' '.join(options["configure-options"].splitlines())
      tarinfo.name = name[:-3]
    elif name == "debian/source/format":
      with open(src_prefix + name) as x:
        x = x.read()
      dsc["Format"] = x.strip()
    else:
      return tarinfo
    taraddtext(tarinfo, x)
  with tarfile.open(os.path.join(location, "debian.tar.xz"), "w:xz") as wtar:
    wtar.add(src_prefix + "debian", "debian", filter=tarfilter)

  with open(os.path.join(location, dsc["Source"] + ".dsc"), 'w') as x:
    x.write(str(dsc))

[geolite2-country]
recipe = slapos.recipe.build:download
filename = GeoLite2-Country.tar.gz

[re6stnet-repository]
recipe = slapos.recipe.build:gitclone
repository = https://lab.nexedi.com/nexedi/re6stnet.git
git-executable = ${git:location}/bin/git

[re6stnet]
=> babeld
recipe = slapos.recipe.build
environment = ${obs-common:environment}
mmdb = ${geolite2-country:target}
name = re6st-node
path = ${re6stnet-repository:location}
pkg-version = 1
cryptography = python3-cryptography (>= 2.6.1)
setup-eggs = hatchling
template_script =
  #!/usr/bin/python3
  import os
  import sys
  from re6st.cli.%s import main
  if __name__ == '__main__':
      os.environ['GEOIP2_MMDB'] = "/usr/share/%s/GeoLite2-Country.mmdb"
      os.environ['PATH'] = "/etc/re6stnet/bin:" + os.environ.get(
          'PATH', '/usr/sbin:/usr/bin:/sbin:/bin')
      sys.exit(main())
install =
  import os, re, shutil, subprocess, sys, tarfile, tempfile
  from io import BytesIO
  from debian.changelog import format_date, Changelog
  from debian.deb822 import Deb822
  from zc.buildout.easy_install import call_pip_command, allow_picked_versions
  class pip_options: pass
  pip_options._allow_picked_versions = allow_picked_versions()

# BBB: We want to support old OS that don't have
#      pybuild-plugin-pyproject/python3-hatchling
#      yet so the Python specific work is done while preparing the "source"
#      package for OBS. Which is acceptable anyway, because re6stnet is
#      pure-Python software and the result is similar to PyPI sdist tarballs.

  cli_dict = {
    'conf': 're6st-conf',
    'node': 're6stnet',
    'registry': 're6st-registry',
  }

  common = self.buildout["obs-common"]
  repos = options["path"]
  def git_output(*args, **kw):
    return subprocess.check_output(("git", *args), cwd=repos, **kw)
  mtime = int(git_output("log", "-1", "--format=%ct", text=True))
  repos_url = git_output("remote", "get-url", "origin", text=True).rstrip()
  if repos_url.endswith(".git"):
    repos_url = repos_url[:-4]

  g = {'__file__': repos + "/re6st/version.py"}
  with open(g['__file__']) as x:
    exec(x.read(), g)
  version = "0.%(revision)s+g%(short)s" % g

  debian = []
  files = git_output("ls-files",
    "daemon", "debian", "docs", "examples", "Makefile",
    text=True).splitlines()
  files.sort()
  prefix = "re6stnet-" + version
  dist_info = "/lib/re6stnet-0.%(revision)s.dist-info" % g
  def taraddtext(tarinfo, text):
    x = text.encode()
    tarinfo.size = len(x)
    wtar.addfile(tarinfo, BytesIO(x))
  def _tarfilter(tarinfo):
    tarinfo.uid = tarinfo.gid = 0
    tarinfo.uname = tarinfo.gname = "root"
    tarinfo.mtime = mtime

  def tarfilter(tarinfo):
    parent, name = os.path.split(tarinfo.name[len(prefix):])
    if parent != dist_info or name not in (
        "RECORD", "REQUESTED", "direct_url.json", "licenses",
      ):
      _tarfilter(tarinfo)
      return tarinfo
  os.makedirs(location)
  with tarfile.open(f"{location}/re6stnet_{version}.tar.xz", "w:xz") as wtar:
    with tempfile.TemporaryDirectory() as tmp:
      call_pip_command(("install", "--no-compile", "-t", tmp),
                       (repos,), pip_options)
      shutil.rmtree(tmp + "/bin")
      wtar.add(tmp, prefix + "/lib", filter=tarfilter)
    for x in files:
      if x.startswith("debian/"):
        if x != "debian/rules":
          debian.append(x)
      else:
          wtar.add(os.path.join(repos, x), os.path.join(prefix, x),
                   filter=tarfilter)
    with tarfile.open(options["mmdb"]) as rtar:
      for tarinfo in rtar:
        x = rtar.extractfile(tarinfo)
        _tarfilter(tarinfo)
        tarinfo.name = os.path.join(prefix, tarinfo.name)
        wtar.addfile(tarinfo, x)

  babeld = self.buildout["babeld"]
  babeld = babeld["epoch"] + ":" + re.match('v(.*)-nxd', babeld["tag"])[1]

  dsc = Deb822()
  dsc["Version"] = version + "-" + options["pkg-version"]
  mtime = common["mtime"]
  def tarfilter(tarinfo):
    _tarfilter(tarinfo)
    name = tarinfo.name
    if name == "debian/control":
      with open(os.path.join(repos, name)) as x:
        s = Deb822(x); b = Deb822(x)
      s["Build-Depends"] = \
        "debhelper-compat (= 12), python3-docutils, " + options["cryptography"]
      for x in "Maintainer", "Vcs-Git":
        s[x] = common[x]
      for x in "Source", "Build-Depends":
        dsc[x] = s[x]
      dsc["Architecture"] = b["Architecture"]
      b["Conflicts"] = b["Replaces"] = b["Provides"] = b["Package"]
      b["Package"] = options["name"]
      b["Depends"] = (
        "%s, openvpn-re6stnet, babeld (>> %s+nxd), iproute2, openssl,"
        " python3-geoip2") % (options["cryptography"], babeld)
      taraddtext(tarinfo, f"{s}\n{b}")

      tarinfo.name = "debian/changelog"
      x = Changelog()
      x.new_block(
        package=s["Source"],
        version=dsc["Version"],
        distributions="nexedi",
        author=s["Maintainer"],
        date=format_date(tarinfo.mtime),
        changes=[""],
      )
      taraddtext(tarinfo, str(x))
    elif name == "debian/source/format":
      with open(os.path.join(repos, name)) as x:
        x = x.read()
      dsc["Format"] = x.rstrip()
      taraddtext(tarinfo, x)
    else:
      return tarinfo
  with tarfile.open(os.path.join(location, "debian.tar.xz"), "w:xz") as wtar:
    wtar.add(os.path.join(common["base"], "re6stnet-debian"), "debian",
             filter=tarfilter)
    for x in debian:
      wtar.add(os.path.join(repos, x), x, filter=tarfilter)
    template_script = options["template_script"] + '\n'
    for x in cli_dict.items():
      tarinfo = tarfile.TarInfo("debian/bin/" + x[1])
      _tarfilter(tarinfo)
      tarinfo.mode |= 0o111
      taraddtext(tarinfo, template_script % (x[0], options["name"]))

  with open(os.path.join(location, "re6stnet.dsc"), 'w') as x:
    x.write(str(dsc))

