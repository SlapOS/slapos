# To be run from erp5.util:testnode, which must provide
# [re6stnet-repository] and [nemu3-repository].

[buildout]
extends =
  ../../stack/slapos.cfg
  testing.cfg
parts =
  slapos-cookbook
  template

[template]
recipe = slapos.recipe.template:jinja2
output = ${buildout:directory}/template.cfg
inline =
  [buildout]
  eggs-directory = ${buildout:eggs-directory}
  develop-eggs-directory = ${buildout:develop-eggs-directory}
  parts = runTestSuite
  [slap-configuration]
  recipe = slapos.cookbook:slapconfiguration.serialised
  computer = $${slap-connection:computer-id}
  partition = $${slap-connection:partition-id}
  url = $${slap-connection:server-url}
  key = $${slap-connection:key-file}
  cert = $${slap-connection:cert-file}
  [directory]
  recipe = slapos.cookbook:mkdirectory
  bin = $${buildout:directory}/bin
  [runTestSuite]
  recipe = slapos.recipe.template:jinja2
  output = $${directory:bin}/$${:_buildout_section_name_}
  url = ${:_profile_base_location_}/$${:_buildout_section_name_}.in
  context =
    section buildout buildout
    section parameter_dict runTestSuite-parameters
    key slapparameter_dict slap-configuration:configuration
  [runTestSuite-parameters]
  environment = {{dumps(environment)}}
  vm = {{dumps(vm)}}
  runTestSuite_py = ${buildout:bin-directory}/${runTestSuite_py:interpreter}
  profile_base_location = ${:_profile_base_location_}
  re6stnet = ${re6stnet-repository:repository}
  nemu3 = ${nemu3-repository:repository}
context =
  section environment vm-run-environment
  section vm vm-debian

[runTestSuite_py]
recipe = zc.recipe.egg
eggs = erp5.util
  zc.buildout
  slapos.libnetworkcache
interpreter = ${:_buildout_section_name_}

[slapos-cookbook]
scripts =

[download]
recipe = slapos.recipe.build:download
shared = true

[obs-key]
<= download
home = https://download.opensuse.org/repositories/home:/VIFIBnexedi
url = ${:home}/Debian_Testing/Release.key#${:md5sum}
md5sum = 58382c54dd36d017af482a9d8a30d85c

[python3-attr]
<= download
url = https://deb.debian.org/debian/pool/main/p/python-attrs/python3-attr_22.2.0-1_all.deb
md5sum = bc6e13b699254387e03656c155c470d2

[multiping-sdist]
<= download
url = https://files.pythonhosted.org/packages/5e/2d/58d80a082f1985c83db0c9927fccb3108cfc6c384d5c55b107a3066eea6b/multiping-1.1.2.tar.gz
md5sum = cceab7574d46030e041c54e12cffde8f

[unshare-sdist]
<= download
url = https://files.pythonhosted.org/packages/15/85/2ba218129c95b894efe87506489b525f859c40f6e21cb0521ff3cec754f4/unshare-0.22.tar.gz
md5sum = 68213fdc40e71eb6d01d0a02677096f5

[vm-debian]
size = 3Gi
dists +=
  debian-bookworm
  debian-bullseye
  debian-buster
file.obs-vifibnexedi.asc = ${obs-key:target}
file.python3-attr.deb = ${python3-attr:target}
file.multiping.tar.gz = ${multiping-sdist:target}
file.unshare.tar.gz = ${unshare-sdist:target}
late-command +=
  sed -i '/^deb cdrom/,/^$/d' /etc/apt/sources.list
  . /etc/os-release
  [ $VERSION_ID -ge 11 ] || echo kernel.unprivileged_userns_clone = 1 >/etc/sysctl.d/99-local.conf
  attr=python3-attr
  [ $VERSION_ID -gt 12 ] || attr=/installer/$attr.deb
  set /etc/apt/keyrings /obs-vifibnexedi.asc
  cat <<EOF >/etc/apt/${vm-common:obs-src}
  Types: deb
  URIs: ${obs-key:home}/Debian_$VERSION_ID
  Suites: ./
  Signed-By: $1$2
  EOF
  install -D -t $1 /installer/$2
  APT="/usr/bin/apt-get -yo Dpkg::options::=--force-unsafe-io"
  $APT update
  $APT install ${vm-common:obs-pkg} $attr
  [ $VERSION_ID -lt 12 ] && z= || z=--break-system-packages
  for x in multiping unshare
  do pip3 install $z --no-index --no-cache --no-build-isolation /installer/$x.tar.gz
  done
packages +=
  git miniupnpd python3-geoip2 python3-miniupnpc python3-openssl
  bridge-utils python3-mock python3-psutil
# build-deps for multiping & unshare
  gcc python3-dev python3-pip python3-setuptools
