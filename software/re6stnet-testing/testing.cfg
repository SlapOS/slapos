[buildout]
extends =
  ../../component/vm-img/debian.cfg
parts =
  testing

[vm-common]
obs-pkg = babeld openvpn-re6stnet
obs-src = sources.list.d/obs-vifibnexedi.sources

[testing]
<= vm-run-base
mem = 2048
command =
  sudo apt-get update -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 \
    -o Dir::Etc::sourcelist=${vm-common:obs-src}
  sudo apt-get upgrade -yo Dpkg::options::=--force-unsafe-io
  . /etc/os-release
  [ $VERSION_ID -lt 12 ] && z= || z=--break-system-packages
  pip3 install $z --no-index --no-cache --no-build-isolation /mnt/nemu3
  dpkg -l ${vm-common:obs-pkg} python3 python3-cryptography
  git clone --shared /mnt/re6stnet
  cd re6stnet
  PYTHONPATH=$PWD PATH=/etc/re6stnet/bin:/usr/sbin:$PATH unshare -Umnr sh -ec '
    mount -t sysfs sysfs /sys
    cd re6st/tests
    python3 -m unittest discover -v'
