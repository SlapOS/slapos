[buildout]
extends =
    ../../component/defaults.cfg
    ../../component/dcron/buildout.cfg
    ../../component/java/buildout.cfg
    ../../component/nginx/buildout.cfg
    ../../component/postgresql/buildout.cfg
    ../../stack/slapos.cfg
    buildout.hash.cfg
    ../../stack/monitor/buildout.cfg

parts =
  slapos-cookbook
  instance-profile

[java]
<= java-re-temurin-25

[postgresql]
<= postgresql18

[dependency-track-apiserver]
recipe = slapos.recipe.build:download-unpacked
url = https://github.com/DependencyTrack/dependency-track/releases/download/5.2.0/dependency-track-apiserver-dist.tar.gz
md5sum = 943292ede8f67fa966b2632bde83b845

[dependency-track-frontend]
recipe = slapos.recipe.build:download-unpacked
url = https://github.com/DependencyTrack/frontend/releases/download/5.2.0/frontend-dist.zip
md5sum = 516b08618bcac88039fb69833b3294a9

[instance-profile]
recipe = slapos.recipe.template
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/instance.cfg
