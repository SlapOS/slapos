[buildout]
extends =
    ../../component/defaults.cfg
    ../../component/dcron/buildout.cfg
    ../../component/java/buildout.cfg
    ../../component/nginx/buildout.cfg
    ../../component/postgresql/buildout.cfg
    ../../stack/slapos.cfg
    buildout.hash.cfg
    ../../stack/monitor/buildout.cfg

parts =
  slapos-cookbook
  instance-profile

[java]
<= java-re-temurin-25

[postgresql]
<= postgresql18

[dependency-track-apiserver]
recipe = slapos.recipe.build:download-unpacked
url = https://github.com/DependencyTrack/dependency-track/releases/download/5.2.1/dependency-track-apiserver-dist.tar.gz
md5sum = 869d6dd17148248a370131b860b4767c

[dependency-track-frontend]
recipe = slapos.recipe.build:download-unpacked
url = https://github.com/DependencyTrack/frontend/releases/download/5.2.1/frontend-dist.zip
md5sum = b6bd744d1fabdfd42ef3f777fa984990

[instance-profile]
recipe = slapos.recipe.template
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/instance.cfg
