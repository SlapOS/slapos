[buildout]
extends =
  ../../stack/slapos.cfg
  ../../stack/monitor/buildout.cfg
  ../../stack/nodejs.cfg
  ../../component/fontconfig/buildout.cfg
  ../../component/freetype/buildout.cfg
  ../../component/graphviz/buildout.cfg
  ../../component/java/buildout.cfg
  ../../component/tomcat/buildout.cfg
  ../../component/fonts/buildout.cfg
  buildout.hash.cfg

parts =
  slapos-cookbook
  instance

[tomcat]
<= tomcat10

[java]
<= java-re-temurin-21

[instance]
recipe = slapos.recipe.template
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/instance.cfg

[tomcat-server-xml]
recipe = slapos.recipe.template
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/${:_buildout_section_name_}

[plantuml.war]
recipe = slapos.recipe.build:download
url = https://github.com/plantuml/plantuml-server/releases/download/v1.2026.10/plantuml-jsp-v1.2026.10.war
md5sum = defb47904d10f1cd1e44eba97e537ac3
