[buildout]
extends =
  ../../component/defaults.cfg
  buildout.hash.cfg
  ../../stack/slapos.cfg
  ../../stack/monitor/buildout.cfg
  ../../component/languagetool/buildout.cfg
  ../../component/java/buildout.cfg

parts =
  slapos-cookbook
  instance-profile
  languagetool

[java]
<= java-re-temurin-21

[jinja-template]
recipe = slapos.recipe.template:jinja2
url = ${:_profile_base_location_}/${:filename}

[instance-profile]
<= jinja-template
output = ${buildout:directory}/instance.cfg
context =
  section buildout buildout
  raw template_monitor ${monitor2-template:output}
  key languagetool_location languagetool:location
  key languagetool_launcher_location languagetool-slapos-launcher:location
  key java_location java:location
  key software_cfg_json software.cfg.json:destination

[copy-to-instance]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:_buildout_section_name_}
filename = ${:_buildout_section_name_}

[copy-at-root]
<= copy-to-instance
destination = ${buildout:directory}/${:_buildout_section_name_}

[software.cfg.json]
<= copy-at-root
depends =
  ${instance-languagetool-input-schema.json:recipe}
  ${instance-languagetool-output-schema.json:recipe}

[instance-languagetool-input-schema.json]
<= copy-at-root

[instance-languagetool-output-schema.json]
<= copy-at-root
