[buildout]
parts =
  slapos-cookbook
  instance-profile
  linuxptp
  iperf3
  mtools
  mosquitto

extends =
  ../../stack/monitor/buildout.cfg
  ../../stack/slapos.cfg
  ../../component/linuxptp/buildout.cfg
  ../../component/osie-coupler/buildout.cfg
  ../../component/iperf3/buildout.cfg
  ../../component/mtools/buildout.cfg
  ../../component/mosquitto/buildout.cfg
  buildout.hash.cfg

[osie-coupler]
bin_dir = ${buildout:directory}/bin/
# copy then rename, as copying over the binary of running couplers fails
# ("Text file busy") while renaming over it is fine
post-install =
  cp bin/server ${:bin_dir}server.new
  mv -f ${:bin_dir}server.new ${:bin_dir}server

[instance-profile]
recipe = slapos.recipe.template:jinja2
url = ${:_profile_base_location_}/${:filename}
mode = 0644
output = ${buildout:directory}/instance.cfg
extensions = jinja2.ext.do
context =
  section buildout buildout
  raw template_monitor ${monitor2-template:output}
  key coupler_location osie-coupler:bin_dir
