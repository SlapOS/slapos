[buildout]
extends =
  ../gnutls/buildout.cfg
  ../gnupg/buildout.cfg

parts =
  libgpgme

[libgpgme]
recipe = slapos.recipe.cmmi
shared = true
url = https://www.gnupg.org/ftp/gcrypt/gpgme/gpgme-1.24.3.tar.bz2
md5sum = c6f85ce24ad46c9469596df0301f32eb
configure-options =
  --disable-gpg-test
  --with-libgpg-error-prefix=${libgpg-error:location}
  --with-libassuan-prefix=${libassuan:location}
make-options =
  PYTHONS=
environment =
  LDFLAGS=-Wl,-rpath=${libgpg-error:location}/lib -Wl,-rpath=${libassuan:location}/lib
