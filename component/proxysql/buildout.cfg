[buildout]
extends =
  ../autoconf/buildout.cfg
  ../automake/buildout.cfg
  ../bison/buildout.cfg
  ../bzip2/buildout.cfg
  ../cmake/buildout.cfg
  ../curl/buildout.cfg
  ../git/buildout.cfg
  ../gnutls/buildout.cfg
  ../icu/buildout.cfg
  ../jemalloc/buildout.cfg
  ../libevent/buildout.cfg
  ../libmicrohttpd/buildout.cfg
  ../libtool/buildout.cfg
  ../m4/buildout.cfg
  ../openssl/buildout.cfg
  ../pcre/buildout.cfg
  ../perl/buildout.cfg
  ../patch/buildout.cfg
  ../util-linux/buildout.cfg
  ../defaults.cfg

parts =
  proxysql

[proxysql]
recipe = slapos.recipe.cmmi
shared = true
version = v4.0.10
openssl = ${openssl-3.5:location}
url = https://github.com/sysown/proxysql/archive/refs/tags/${:version}.tar.gz
md5sum = 7889dc3fa7439d1497ed25f896dc4537
configure-command = true
make-options = GIT_VERSION_BASE=${:version} CMAKE_POLICY_VERSION_MINIMUM=3.5
# The install target does not honor DESTDIR:
# let's forget it and only install what we need.
make-targets = src/proxysql
post-install =
  install -Dt %(location)s/bin %(make-targets)s
environment =
  PKG_CONFIG_PATH=${curl:location}/lib/pkgconfig:${gnutls:location}/lib/pkgconfig:${icu4c:location}/lib/pkgconfig:${libevent2:location}/lib/pkgconfig:${libgcrypt:location}/lib/pkgconfig:${pcre:location}/lib/pkgconfig:${:openssl}/lib/pkgconfig:${zlib:location}/lib/pkgconfig
  PATH=${autoconf:location}/bin:${automake:location}/bin:${bison:location}/bin:${bzip2:location}/bin:${cmake:location}/bin:${curl:location}/bin:${git:location}/bin:${icu4c:location}/bin:${libgcrypt:location}/bin:${libtool:location}/bin:${m4:location}/bin:${perl:location}/bin:${pkgconfig:location}/bin:${python3:location}/bin:%(PATH)s
  CXXFLAGS=-I${gnutls:location}/include -I${icu4c:location}/include -I${libuuid:location}/include -I${:openssl}/include -I${zlib:location}/include
  CFLAGS=-I${gnutls:location}/include -I${icu4c:location}/include -I${libevent2:location}/include
  LDFLAGS=-L${curl:location}/lib -Wl,-rpath=${curl:location}/lib -L${gnutls:location}/lib -Wl,-rpath -Wl,${gnutls:location}/lib -L${icu4c:location}/lib -Wl,-rpath -Wl,${icu4c:location}/lib -L${jemalloc:location}/lib -L${libevent2:location}/lib -Wl,-rpath -Wl,${libevent2:location}/lib -L${libmicrohttpd:location}/lib -L${libtool:location}/lib -L${libuuid:location}/lib -Wl,-rpath -Wl,${libuuid:location}/lib -L${:openssl}/lib -Wl,-rpath -Wl,${:openssl}/lib -L${pcre:location}/lib -L${zlib:location}/lib -Wl,-rpath -Wl,${zlib:location}/lib
  CMAKE_INCLUDE_PATH=${curl:location}/include:${gnutls:location}/include:${jemalloc:location}/include:${libmicrohttpd:location}/include:${pcre:location}/include:${:openssl}/include:${zlib:location}/include
  CMAKE_LIBRARY_PATH=${curl:location}/lib:${gnutls:location}/lib:${jemalloc:location}/lib:${libmicrohttpd:location}/lib:${pcre:location}/lib:${:openssl}/lib:${zlib:location}/lib
  LIBTOOL=libtool
  ACLOCAL_PATH=${pkgconfig:location}/share/aclocal:${libtool:location}/share/aclocal
  EXTRALINK=-L${gnutls:location}/lib -Wl,-rpath -Wl,${gnutls:location}/lib -L${libuuid:location}/lib -Wl,-rpath -Wl,${libuuid:location}/lib -L${:openssl}/lib -Wl,-rpath -Wl,${:openssl}/lib -L${zlib:location}/lib -Wl,-rpath -Wl,${zlib:location}/lib
  LD_LIBRARY_PATH=${:openssl}/lib
patch-binary = ${patch:location}/bin/patch
patch-options = -p1
patches = 
  ${:_profile_base_location_}/0001-Always-require-a-valid-certificate-from-client.patch#b3dfa8432b9387655337a94f9df2b083
  ${:_profile_base_location_}/0002-Build-re2-with-global-dynamic-TLS-model.patch#fa39e93a4001dbbe8e7769d11d9d4bb7
  ${:_profile_base_location_}/0003-Fix-libusual-configure-openssl-prefix-path.patch#7eb853f8ae05b54e1e3a3b496ce193e0
