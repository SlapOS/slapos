[buildout]
extends = ../java/buildout.cfg
parts =
  languagetool
  languagetool-slapos-launcher

[languagetool]
recipe = slapos.recipe.build:download-unpacked
shared = true
version = 6.8
url = https://repo1.maven.org/maven2/org/languagetool/languagetool-standalone/${:version}/languagetool-standalone-${:version}.zip
md5sum = 138da863312657903e9d4d4251c493b1
strip-top-level-dir = true

[languagetool-slapos-launcher]
recipe = slapos.recipe.build
shared = true
url = ${:_profile_base_location_}/SlapOSHTTPServer.java
md5sum = 786710c5a9127df996a63dd70c6e578d
install =
  import os, shutil, subprocess
  os.makedirs(location)
  src = os.path.join(location, 'SlapOSHTTPServer.java')
  shutil.copy(self.download(), src)
  subprocess.check_call([
    '${java-jdk-temurin-21:location}/bin/javac', '--release', '17',
    '-cp', '${languagetool:location}/languagetool-server.jar:${languagetool:location}/libs/*',
    '-d', location, src])
  os.unlink(src)
