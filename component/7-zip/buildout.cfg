# 7-Zip console version (7zz), actively maintained upstream at
# https://github.com/ip7z/7zip . This replaces the discontinued p7zip
# (last release 16.02, source archives removed from upstream), fixing
# CVE-2022-47069 and CVE-2026-111497 (bundled brotli decoder), as well
# as CVE-2016-9296 and CVE-2017-17969, which are fixed natively.
# The binary is installed as bin/7z (in addition to bin/7zz) with the
# same command line interface, so consumers of p7zip keep working.
[buildout]
parts = 7-zip

[7-zip]
recipe = slapos.recipe.build
shared = true
url = https://github.com/ip7z/7zip/archive/refs/tags/${:version}.tar.gz
version = 26.06
md5sum = d6d923eee1ed7b356a44b1d2b05b71fc
install =
  import os, shutil, subprocess
  d = self.extract(self.download(self.options['url'], self.options['md5sum']))
  if not os.path.isdir(os.path.join(d, 'CPP')):
      d = os.path.join(d, os.listdir(d)[0])
  subprocess.check_call(['make', '-C', 'CPP/7zip/Bundles/Alone2', 'USE_ASM=',
                         '-f', '../../cmpl_gcc_x64.mak'], cwd=d)
  bindir = os.path.join(location, 'bin')
  os.makedirs(bindir)
  for name in ('7z', '7zz'):
      shutil.copy(os.path.join(d, 'CPP/7zip/Bundles/Alone2/b/g_x64/7zz'),
                  os.path.join(bindir, name))
