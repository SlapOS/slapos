[buildout]
extends =
  ../librsync/buildout.cfg
  ../python-2.7/buildout.cfg
parts =
  rdiff-backup-script
  rdiff-backup-1.3.4

[rdiff-backup-egg]
recipe = zc.recipe.egg:custom
egg = rdiff-backup
setup-eggs =
  setuptools-scm
include-dirs =
  ${librsync:location}/include
library-dirs =
  ${librsync:location}/lib
rpath =
  ${librsync:location}/lib

[rdiff-backup-script]
recipe = zc.recipe.egg:scripts
location = ${buildout:directory}
eggs = ${rdiff-backup-egg:egg}
entry-points = rdiff-backup=rdiffbackup.run:main
scripts = rdiff-backup

# rdiff-backup 1.x, kept alongside rdiff-backup-script (2.x) above. The two
# major versions do not speak the same network protocol, so a software
# release that pulls from remote ends still running rdiff-backup 1.x needs
# this binary to talk to them, while rdiff-backup-script talks to 2.x ends.
# XXX once every remote has migrated to rdiff-backup 2.x, remove this part
# (rdiff-backup-common, rdiff-backup-common:python27, rdiff-backup-1.3.4,
# the patch file and the python-2.7 extends above) entirely.
[rdiff-backup-common]
recipe = slapos.recipe.cmmi
shared = true
patch-options = -p1
patch-binary = ${patch:location}/bin/patch
configure-command = true
make-binary = true
post-install =
  set %(location)s/lib/python2.7
  %(python)s setup.py build_ext -I${librsync:location}/include -L${librsync:location}/lib -R${librsync:location}/lib build install --prefix=%(location)s --install-lib=$1
  cd %(location)s/bin
  sed -i '/^import\b.*\bsys\b/s,$,\nsys.path[0] = '\"$1\", *
  ./rdiff-backup -V
python = ${python2.7:executable}

[rdiff-backup-common:python27]
python = ${buildout:executable}

[rdiff-backup-1.3.4]
<= rdiff-backup-common
# use our own version
url = http://www.nexedi.org/static/packages/source/rdiff-backup-1.3.4nxd6.tar.gz
md5sum = 06b8df2099baebca6086a315b031fd53
patches =
  ${:_profile_base_location_}/rdiff-backup-1.3.4-librsync-1.0.0.patch#31fafc8bc4a00f002f52008a9f3b671f
