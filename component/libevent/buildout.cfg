[buildout]
parts = libevent
extends =
  ../openssl/buildout.cfg

[libevent2]
recipe = slapos.recipe.cmmi
url = https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz
md5sum = eaa0bd3472b5d6a52ac6b9e0b7418b03
shared = true
configure-options =
  --disable-static
environment =
  CPPFLAGS=-I${openssl:location}/include
  LDFLAGS=-L${openssl:location}/lib -Wl,-rpath=${openssl:location}/lib
