[buildout]
extends =
  ../pcre/buildout.cfg
  ../python-cffi/buildout.cfg
  ../r-language/buildout.cfg
  ../xz-utils/buildout.cfg

# rpy2 needs R in $PATH
# to use rpy2 you need a wrapper that sets ${r-language:location}/bin in PATH
# see ../manpy/buildout.cfg as an example

[rpy2-env]
PATH = ${r-language:location}/bin:%(PATH)s

[rpy2-base]
recipe = zc.recipe.egg:custom
environment = rpy2-env
egg = ${:_buildout_section_name_}
rpath =
  ${pcre:location}/lib
  ${readline:location}/lib
  ${xz-utils:location}/lib
  ${r-language:location}/lib/R/lib
  ${r-language:location}/lib64/R/lib
library-dirs =
  ${pcre:location}/lib
  ${readline:location}/lib
  ${xz-utils:location}/lib
include-dirs =
  ${readline:location}/include
setup-eggs =
  ${python-cffi:egg}

[rpy2]
<= rpy2-base
patches =
  ${:_profile_base_location_}/rpy2-setuptools-pyproject.toml-license-workaround.patch#17187b8d392fd9e8ef7b12eb0420a7c5
patch-options = -p1
initialization =
  # rpy2 needs R in $PATH
  import os
  os.environ['PATH'] = '${r-language:location}/bin' + os.pathsep + os.environ.get('PATH', '')
depends =
  ${rpy2-rinterface:egg}
  ${rpy2-robjects:egg}

[rpy2-rinterface]
<= rpy2-base

[rpy2-robjects]
<= rpy2-base
