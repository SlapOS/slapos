[buildout]
extends =
  ../rust/buildout.cfg
  ../libcap-ng/buildout.cfg
  ../libseccomp/buildout.cfg

parts =
  virtiofsd

[virtiofsd]
recipe = slapos.recipe.cmmi
shared = true
url = https://gitlab.com/virtio-fs/virtiofsd/-/archive/v1.14.0/virtiofsd-v1.14.0.tar.gz
md5sum = 892f70d1478a88731a0dae2a694a20f0
configure-command =
  cargo build --release
make-binary = /bin/true
make-options =
environment =
  PATH=${rustc:location}/bin:${cmake:location}/bin:%(PATH)s
  LIBCAPNG_LIB_PATH=${libcap-ng:location}/lib
  LIBSECCOMP_LIB_PATH=${libseccomp:location}/lib
  RUSTFLAGS=-C link-arg=-Wl,-rpath=${libcap-ng:location}/lib -C link-arg=-Wl,-rpath=${libseccomp:location}/lib
post-install =
  mkdir -p %(location)s/bin
  cp target/release/virtiofsd %(location)s/bin/
