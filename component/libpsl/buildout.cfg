[buildout]
extends =
  ../icu/buildout.cfg
  ../lunzip/buildout.cfg
  ../pkgconfig/buildout.cfg

[libpsl]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/rockdaboot/libpsl/releases/download/0.21.5/libpsl-0.21.5.tar.lz
md5sum = ae11292a00af33f91af16acc04f6049b
configure-options =
  --disable-static
  --disable-gtk-doc-html
environment =
  PATH=${lunzip:location}/bin:=${pkgconfig:location}/bin:%(PATH)s
  LIBICU_CFLAGS=-I${icu:location}/include
  LIBICU_LIBS=-licuuc -licudata -L${icu:location}/lib -Wl,-rpath=${icu:location}/lib
