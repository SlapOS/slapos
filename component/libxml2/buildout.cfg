# libxml2 - the XML C parser and toolkit
# http://xmlsoft.org/

[buildout]
extends =
  ../perl/buildout.cfg
  ../zlib/buildout.cfg
  ../xz-utils/buildout.cfg

parts =
  libxml2

[libxml2]
recipe = slapos.recipe.cmmi
shared = true
url = https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.3.tar.xz
md5sum = b7b0123654f86ebf630a5cbedaafdece
configure-options =
  --disable-static
  --without-python
  --without-lzma
  --with-zlib=${zlib:location}
environment =
  PATH=${perl:location}/bin:${xz-utils:location}/bin:%(PATH)s
  LDFLAGS=-Wl,-rpath=${zlib:location}/lib

#libxmlsec needs libxml < 2.14
[libxml2:python2]
url = https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.9.tar.xz
md5sum = ad95ba044a372e2f4c886cbac679e798
