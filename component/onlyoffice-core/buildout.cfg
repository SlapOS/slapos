[buildout]
extends =
  ../binutils/buildout.cfg
  ../boost-lib/buildout.cfg
  ../libxml2/buildout.cfg
  ../zlib/buildout.cfg
  ../icu/buildout.cfg
# for qmake
  ../qt/buildout.cfg
  ../defaults.cfg

parts +=
  onlyoffice-core

[onlyoffice-core]
recipe = slapos.recipe.cmmi
shared = true
location = @@LOCATION@@
url = https://lab.nexedi.com/nexedi/onlyoffice_core/-/archive/bk-20260903/onlyoffice_core-bk-20260903.tar.bz2
# This url contains the hash provided by the DocumentServer core submodule hash.
# https://github.com/ONLYOFFICE/DocumentServer/
md5sum = 830135593885c7594ceb7ac81deb2b7c
configure-command = true
make-targets = lib bin
environment =
  PATH=${binutils:location}/bin:${qt5-qmake:location}/bin:%(PATH)s
  CXXFLAGS=-I${libxml2:location}/include -I${zlib:location}/include -I${icu4c-58.2:location}/include -I${boost-lib:location}/include -Wno-comment -Wno-deprecated-declarations -Wno-endif-labels -Wno-parentheses -Wno-reorder -Wno-sign-compare -Wno-switch -Wno-unknown-pragmas -Wno-unused
  LDFLAGS=-L${libxml2:location}/lib -Wl,-rpath=${libxml2:location}/lib -L${zlib:location}/lib -Wl,-rpath=${zlib:location}/lib -L${icu4c-58.2:location}/lib -Wl,-rpath=${icu4c-58.2:location}/lib -L${boost-lib:location}/lib -Wl,-rpath=${boost-lib:location}/lib -Wl,-rpath=${:location}/lib
post-install =
  set -x
  mkdir -p ${:location}/bin ${:location}/lib
  mv -t ${:location}/lib build/lib/*/*.so
  mv -t ${:location}/bin build/bin/*/*
# the binary linux_64 in build/bin/AllFontsGen is renamed AllFontsGen here.
#  mv build/bin/AllFontsGen/* ${:location}/bin/AllFontsGen
