[buildout]

parts =
  redis

extends =
  ../tcl/buildout.cfg

[redis]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/redis/redis/archive/refs/tags/8.12.0.tar.gz
md5sum = adce287fe6d45828b1042eb737fa178a
configure-command = true
prefix =
make-options =
  PREFIX=%(location)s
  V=1
make-targets =
  install
# There are many tests failing, so disable make test for now
#  test
environment =
  PATH=${tcl:location}/bin:%(PATH)s
