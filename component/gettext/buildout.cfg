[buildout]
parts =
  gettext
extends =
  ../libiconv/buildout.cfg
  ../libxml2/buildout.cfg
  ../lunzip/buildout.cfg
  ../ncurses/buildout.cfg
  ../perl/buildout.cfg
  ../zlib/buildout.cfg

[gettext]
recipe = slapos.recipe.cmmi
shared = true
url = https://ftp.gnu.org/pub/gnu/gettext/gettext-1.0.tar.lz
md5sum = 83199a6c26bfda3f0c425b94e814139a

configure-options =
  --disable-static
  --disable-java
  --disable-native-java
  --disable-csharp
  --disable-more-warnings
  --with-libncurses-prefix=${ncurses:location}
  --with-libxml2-prefix=${libxml2:location}
  --with-libiconv-prefix=${libiconv:location}
  --with-included-libintl
  --without-emacs
  --without-selinux
  --disable-acl
  --disable-openmp
  --without-git
  --without-bz2
  --without-xz

environment =
  PATH=${perl:location}/bin:${lunzip:location}/bin:%(PATH)s
  CPPFLAGS=-I${libxml2:location}/include -I${zlib:location}/include -I${ncurses:location}/include
  LDFLAGS=-L${libxml2:location}/lib -Wl,-rpath=${libxml2:location}/lib -L${zlib:location}/lib -Wl,-rpath=${zlib:location}/lib -L${ncurses:location}/lib -Wl,-rpath=${ncurses:location}/lib

[gettext:python2]
# Intentionally keep this section different from the Python 3 version.
# Rebootstrap may use Python 3 while the instance uses Python 2. Since libxml2
# is recompiled after rebootstrap, reusing its gettext section can result in
# an ABI mismatch and an inconsistent state.
#
# Force this section to be recompiled together with libxml2:python2.
a = b
