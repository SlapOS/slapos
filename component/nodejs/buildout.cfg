[buildout]
extends =
  ../coreutils/buildout.cfg
  ../patch/buildout.cfg
  ../git/buildout.cfg
  ../pkgconfig/buildout.cfg
  ../openssl/buildout.cfg
  ../zlib/buildout.cfg
  ../python-2.7/buildout.cfg
  ../python3/buildout.cfg

parts =
  nodejs

# nodejs >= 16 needs gcc >= 8.3
# nodejs >= 22 needs gcc >= 12.3
[gcc]
min-version += 8.3


[nodejs]
<= nodejs-22.23.4

[nodejs-headers]
<= nodejs-headers-22.23.4


[node-gyp-environment]
# environment section to build with node-gyp.
# node-gyp downloads a tarball containing nodejs headers by default
# this uses a locally downloaded tarball, for reproductibility.
npm_config_tarball = ${nodejs-headers:target}

[nodejs-20.20.1]
<= nodejs-base
version = v20.20.1
md5sum = bcb4fe4fe21d9dded42dcb000e9fab1b

[nodejs-headers-20.20.1]
<= nodejs-headers-base
version = v20.20.1
md5sum = 3a13cdf76e5cb69bfa49a244d7bbbec7

[nodejs-22.23.4]
<= nodejs-base
version = v22.23.4
md5sum = 29aec5d1c94800259627687105348db7

[nodejs-headers-22.23.4]
<= nodejs-headers-base
version = v22.23.4
md5sum = f6da1508165520d12e239fbf43e6a1b6

[nodejs-24.22.1]
<= nodejs-base
version = v24.22.1
md5sum = 25c1a0204e8c1b85539141e739317ab0

[nodejs-headers-24.22.1]
<= nodejs-headers-base
version = v24.22.1
md5sum = bae86cf95014404eee98ce21d76c1f93

[nodejs-12.18.3]
<= nodejs-base
version = v12.18.3
md5sum = 28bf6a4d98b238403fa58a0805f4a979
openssl-location = ${openssl-1.1:location}
PATH = ${pkgconfig:location}/bin:${python2.7:location}/bin:%(PATH)s
configure-command = ./configure

[nodejs-base]
# Server-side Javascript.
version =
md5sum =
openssl-location = ${openssl:location}

recipe = slapos.recipe.cmmi
shared = true
url = https://nodejs.org/dist/${:version}/node-${:version}.tar.gz
configure-command = python3 configure
configure-options =
  --prefix=%(location)s
  --shared-openssl
  --shared-openssl-includes=${:openssl-location}/include
  --shared-openssl-libpath=${:openssl-location}/lib
PATH = ${python3:location}/bin:${pkgconfig:location}/bin:%(PATH)s
environment =
  HOME=@@LOCATION@@
  PATH=${:PATH}
  PKG_CONFIG_PATH=${:openssl-location}/lib/pkgconfig/
  CPPFLAGS=-I${zlib:location}/include
  LDFLAGS=-Wl,-rpath=${:openssl-location}/lib -L${zlib:location}/lib -Wl,-rpath=${zlib:location}/lib
  LD_LIBRARY_PATH=${:openssl-location}/lib

[nodejs-headers-base]
recipe = slapos.recipe.build:download
shared = true
version =
md5sum =
url = https://nodejs.org/download/release/${:version}/node-${:version}-headers.tar.gz
