[buildout]
extends =
  ../rust/buildout.cfg
  ../curl/buildout.cfg
  ../openssl/buildout.cfg

parts =
  scaphandre

[scaphandre]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/hubblo-org/scaphandre/archive/refs/tags/v1.0.3.tar.gz
md5sum = af4101b0a6e008f93e5d50be0c8523fb
# The qemu exporter hardcodes its output directory to
# /var/lib/libvirt/scaphandre, a libvirt convention a SlapOS partition
# cannot write to (one Unix user per partition, no shared root-owned
# state). Read it from the environment instead, so each kvm instance can
# point it at its own srv directory, default unchanged for anyone else
# running this binary outside SlapOS.
pre-configure =
  sed -i 's#let path = "/var/lib/libvirt/scaphandre";#let path_owned = std::env::var("SCAPHANDRE_QEMU_PATH").unwrap_or_else(|_| "/var/lib/libvirt/scaphandre".to_string());\n        let path = path_owned.as_str();#' src/exporters/qemu.rs
configure-command =
  cargo build --release
make-binary = /bin/true
make-options =
environment =
  PATH=${rustc:location}/bin:${cmake:location}/bin:${curl:location}/bin:%(PATH)s
  PKG_CONFIG_PATH=${curl:location}/lib/pkgconfig:${openssl:location}/lib/pkgconfig
  OPENSSL_DIR=${openssl:location}
  RUSTFLAGS=-C link-arg=-Wl,-rpath=${openssl:location}/lib -C link-arg=-Wl,-rpath=${curl:location}/lib
post-install =
  mkdir -p %(location)s/bin
  cp target/release/scaphandre %(location)s/bin/
