[buildout]
extends =
  ../libffi/buildout.cfg
  ../pkgconfig/buildout.cfg

parts =
  python-cffi

[python-cffi]
recipe = zc.recipe.egg:custom
egg = cffi
environment = python-cffi-env
library-dirs =
  ${libffi:location}/lib/
rpath =
  ${libffi:location}/lib/
cffi-patches = ${:_profile_base_location_}/cffi-setuptools-pyproject.toml-license-workaround.patch#b80600e83fce5766fb8690bacd5edde2
cffi-patch-options = -p1

[python-cffi-env]
PATH = ${pkgconfig:location}/bin:%(PATH)s
PKG_CONFIG_PATH = ${libffi:location}/lib/pkgconfig

[python-cffi:python2]
cffi-patches =
