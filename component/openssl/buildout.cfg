# OpenSSL - a toolkit implementing SSL v2/v3 and TLS v1 protocols as
#           well as a full-strength general purpose cryptography
#           library.
# http://www.openssl.org/

[buildout]
extends =
  ../ca-certificates/buildout.cfg
  ../coreutils/buildout.cfg
  ../patch/buildout.cfg
  ../perl/buildout.cfg
  ../zlib/buildout.cfg

parts =
  openssl-output

[openssl-common]
recipe = slapos.recipe.cmmi
shared = true
location = @@LOCATION@@
# 'prefix' option to override --openssldir/--prefix (which is useful
# when combined with DESTDIR). Used by slapos.package.git/obs
prefix = ${:location}
make-install-extra =
certs = ${:location}/etc/ssl/certs
configure-command = ./config
# Only ever set per architecture, in a conditional section below: a -march
# here restricts the build to the CPU of the machine that produced it, and
# these binaries are distributed through the binary cache.
arch-configure-options =
configure-options =
  ${:arch-configure-options}
  --with-zlib-include=${zlib:location}/include
  --with-zlib-lib=${zlib:location}/lib
  --openssldir=${:prefix}/etc/ssl
  --prefix=${:prefix}
  --libdir=lib
  shared no-idea no-mdc2 no-rc5 zlib
  -Wl,-rpath=${zlib:location}/lib -Wl,-rpath=${:location}/lib
  && make depend
make-options =
  SHARED_LDFLAGS='-Wl,-rpath=${:location}/lib -Wl,-rpath=${zlib:location}/lib'
make-targets =
  -j1 install_sw install_ssldirs ${:make-install-extra} &&
  rm -f ${:certs}/* &&
  for i in ${ca-certificates:location}/certs/*/*.crt; do
    ln -sfv $i ${:certs}/`${:location}/bin/openssl x509 -hash -noout -in $i`.0
  ; done
patch-binary = ${patch:location}/bin/patch
patch-options = -p1
environment =
  PATH=${patch:location}/bin:${perl:location}/bin:%(PATH)s

[openssl-common:platform.machine() == 'armv7l' or platform.machine() == 'armv8l']
# We need this fix for Debian12 compilation in OBS
#
# Indeed, Debian12's gcc will add by default those 2 args on the compilation command line
#   -march=armv7-a+fp -mfloat-abi=hard
#
# Then ./config of openssl picks the FPU-less generic linux-armv4 target and add the following arg:
#   -march=armv7-a
#
# The result is
#   -march=armv7-a+fp -mfloat-abi=hard -march=armv7-a
#
# And since the last -march arg is winning we have the error "selected architecture lacks an FPU"
#
# We readd explicitely -march=armv7-a+fp argument at the end of the command line to be back to GCC's default
arch-configure-options = -march=armv7-a+fp

[openssl-3.5]
<= openssl-common
url = https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz
md5sum = 88975626b10916f46c14ce74d69482d0

[openssl-1.1]
<= openssl-common
url = https://www.openssl.org/source/openssl-1.1.1w.tar.gz
md5sum = 3f76825f195e52d4b10c70040681a275
patches =
  ${:_profile_base_location_}/debian_1.1.1w-0+deb11u5.patch#d93ec8b5d7eed04f1c9fb36d3d4c5008

[openssl]
location = ${openssl-3.5:location}

[openssl-output]
# Shared binary location to ease migration
recipe = plone.recipe.command
stop-on-error = true
update-command = ${:command}
command = ${coreutils-output:test} -x ${:openssl}
openssl = ${openssl:location}/bin/openssl
