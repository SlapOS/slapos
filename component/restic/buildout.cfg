[buildout]
extends =
  ../../component/golang/buildout.cfg

parts =
  restic

[restic]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/restic/restic/releases/download/v0.20.0/restic-0.20.0.tar.gz
md5sum = 13609ff3f4f7ac521a779399a7d132c0
configure-command = :
make-binary = go run build.go -o @@LOCATION@@/bin/restic
make-targets =
environment =
  PATH=${golang1.26:location}/bin:${git:location}/bin:%(PATH)s
