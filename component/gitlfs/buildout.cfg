[buildout]
extends =
  ../git/buildout.cfg
  ../golang/buildout.cfg

parts = gitlfs

[gitlfs]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-v3.8.0.tar.gz
md5sum = 57f4f89dab287b48b5640e694a6bca4d
configure-command = :
environment = 
  PATH=${golang1.26:location}/bin:%(PATH)s
make-targets =
post-install =
  mkdir -p @@LOCATION@@/bin
  cp bin/git-lfs @@LOCATION@@/bin/git-lfs
  cat > @@LOCATION@@/bin/git <<'EOF'
  #!/bin/sh
  PATH=@@LOCATION@@/bin:$PATH
  export PATH
  exec ${git:location}/bin/git \
    -c filter.lfs.clean="git-lfs clean -- %%f" \
    -c filter.lfs.smudge="git-lfs smudge -- %%f" \
    -c filter.lfs.process="git-lfs filter-process" \
    -c filter.lfs.required=true \
    "$@"
  EOF
  chmod +x @@LOCATION@@/bin/git

