[buildout]
extends =
    ../xz-utils/buildout.cfg
    ../cmake/buildout.cfg
    ../git/buildout.cfg
parts = llvm

[llvm-cmake]
recipe = slapos.recipe.build:download-unpacked
shared = true
url = https://github.com/llvm/llvm-project/releases/download/llvmorg-${:version}/cmake-${:version}.src.tar.xz
version = 21.1.8
md5sum = fb75e927effbedba72de1f421154fd0c
environment =
  PATH=${xz-utils:location}/bin:%(PATH)s

[llvm-third-party]
recipe = slapos.recipe.build:download-unpacked
shared = true
url = https://github.com/llvm/llvm-project/releases/download/llvmorg-${:version}/third-party-${:version}.src.tar.xz
version = 21.1.8
md5sum = 4cad220587e039a2ff9465766c018621
environment =
  PATH=${xz-utils:location}/bin:%(PATH)s

[llvm]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/llvm/llvm-project/releases/download/llvmorg-${:version}/llvm-${:version}.src.tar.xz
version = 21.1.8
md5sum = a45a3d91b0b178759b5ee86be81e1ca1
pre-configure =
  mkdir -p ../cmake/Modules
  cp ${llvm-cmake:location}/Modules/* ../cmake/Modules/
configure-command = ${cmake:location}/bin/cmake
configure-options =
    -Bbuild
    -DCMAKE_INSTALL_PREFIX=@@LOCATION@@
    -DCMAKE_BUILD_TYPE=Release
    -DLLVM_INSTALL_UTILS=ON
    -DLLVM_INCLUDE_BENCHMARKS=OFF
    -DLLVM_INCLUDE_TESTS=OFF
    -DLLVM_INCLUDE_EXAMPLES=OFF
    -DLLVM_INCLUDE_DOCS=OFF
    -DLLVM_ENABLE_BINDINGS=OFF
    -DLLVM_TARGETS_TO_BUILD=Native
    -DLLVM_THIRD_PARTY_DIR=${llvm-third-party:location}
    -DLIBXML2_LIBRARY=${libxml2:location}/lib/libxml2.so
    -DLIBXML2_INCLUDE_DIR=${libxml2:location}/include/libxml2
    -DZLIB_INCLUDE_DIR=${zlib:location}/include
    -DZLIB_LIBRARY=${zlib:location}/lib

make-options = -C build
environment =
    PATH=${xz-utils:location}/bin:${git:location}/bin:%(PATH)s
    LDFLAGS=-Wl,-rpath=${libxml2:location}/lib -Wl,-rpath=${zlib:location}/lib
