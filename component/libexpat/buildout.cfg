[buildout]
extends =
  ../lunzip/buildout.cfg
parts =
  libexpat

[libexpat]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/libexpat/libexpat/releases/download/R_2_11_0/expat-2.11.0.tar.lz
md5sum = c3a3b3c2a1ca45108b8072379711edaa
configure-options =
  --disable-static
  --without-xmlwf
  --without-examples
  --without-tests
  --without-docbook
environment =
  PATH=${lunzip:location}/bin:%(PATH)s
