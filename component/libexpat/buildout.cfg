[buildout]
extends =
  ../lunzip/buildout.cfg
parts =
  libexpat

[libexpat]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/libexpat/libexpat/releases/download/R_2_8_3/expat-2.8.3.tar.lz
md5sum = 6a83f159763c0bccc91d2fa81fd2cfb8
configure-options =
  --disable-static
  --without-xmlwf
  --without-examples
  --without-tests
  --without-docbook
environment =
  PATH=${lunzip:location}/bin:%(PATH)s
