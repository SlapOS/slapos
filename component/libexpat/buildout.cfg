[buildout]
extends =
  ../lunzip/buildout.cfg
parts =
  libexpat

[libexpat]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/libexpat/libexpat/releases/download/R_2_9_0/expat-2.9.0.tar.lz
md5sum = a79b2f719e9cb90461a712dd2b002a63
configure-options =
  --disable-static
  --without-xmlwf
  --without-examples
  --without-tests
  --without-docbook
environment =
  PATH=${lunzip:location}/bin:%(PATH)s
