[buildout]
extends =
  ../../component/git/buildout.cfg
  ../../component/golang/buildout.cfg


[restic-rest-server]
recipe = slapos.recipe.cmmi
shared = true
url = https://github.com/restic/rest-server/releases/download/v0.15.0/rest-server-0.15.0.tar.gz
md5sum = 6c988f81a58f9b2f65602ac1f41b0641
configure-command = :
make-binary = go build -o @@LOCATION@@/bin/rest-server ./cmd/rest-server
make-targets =
environment =
  CGO_ENABLED=0
  PATH=${golang1.26:location}/bin:${git:location}/bin:%(PATH)s
