[buildout]
extends =
  ../patch/buildout.cfg

[policyd-rate-limit]
recipe = zc.recipe.egg
eggs = policyd-rate-limit
scripts = ${:eggs}
bin = ${buildout:bin-directory}/${:scripts}
policyd-rate-limit-patches =
  ${:_profile_base_location_}/policyd-rate-limit-by-sender-domain.patch#69f7ccb85d19d0c03ae6d2f0aec6f9d2
  ${:_profile_base_location_}/policyd-rate-limit-py3-12.patch#6732618dc9b5ead33265d82fc6d79af7
policyd-rate-limit-patch-options = -p1
patch-binary = ${patch:location}/bin/patch

