# git - a distributed version control system with speed and efficiency
# https://git-scm.com/

[buildout]
extends =
  ../curl/buildout.cfg
  ../gettext/buildout.cfg
  ../libexpat/buildout.cfg
  ../openssl/buildout.cfg
  ../patch/buildout.cfg
  ../pcre2/buildout.cfg
  ../perl/buildout.cfg
  ../tar/buildout.cfg
  ../xz-utils/buildout.cfg
  ../zlib/buildout.cfg
parts =
  git

[git]
recipe = slapos.recipe.cmmi
shared = true
url = https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.1.tar.xz
md5sum = d2df0c50f3efa05e578ef0fe0bc198b9
configure-options =
  --with-curl=${curl:location}
  --with-openssl=${openssl:location}
  --with-zlib=${zlib:location}
  --with-libpcre2=${pcre2:location}
  --with-expat=${libexpat:location}
  --with-perl=${perl:location}/bin/perl
environment =
  NO_PYTHON=y
  NO_TCLTK=y
  NO_RUST=y
  PATH=${curl:location}/bin:${gettext:location}/bin:${tar:location}/bin:${xz-utils:location}/bin:%(PATH)s
  CPPFLAGS=-I${zlib:location}/include
  LDFLAGS=-L${zlib:location}/lib -L${openssl:location}/lib -L${pcre2:location}/lib -Wl,-rpath=${openssl:location}/lib -Wl,-rpath=${zlib:location}/lib -Wl,-rpath=${curl:location}/lib -Wl,-rpath=${libexpat:location}/lib -Wl,-rpath=${pcre2:location}/lib

[gitweb]
<= git
make-targets = install-gitweb
make-options = bindir="${git:location}/bin/"
